[framework]
active_environment = qa
browser = chrome
headless = false

[qa]
base_url = https://www.saucedemo.com/
username = ${APP_USERNAME}
password = ${APP_PASSWORD}
browser = chrome
headless = false
timeout = 15

[staging]
base_url = https://staging.example.com/
username = ${APP_USERNAME}
password = ${APP_PASSWORD}
browser = chrome
headless = true
timeout = 20

[production]
base_url = https://www.example.com/
username = ${APP_USERNAME}
password = ${APP_PASSWORD}
browser = chrome
headless = true
timeout = 30

[chrome]
browser_name = chrome
headless = false
window_size = 1920,1080

[firefox]
browser_name = firefox
headless = false
window_size = 1920,1080

[edge]
browser_name = edge
headless = false
window_size = 1920,1080

[browserstack]
enabled = false
username = ${BROWSERSTACK_USERNAME}
access_key = ${BROWSERSTACK_ACCESS_KEY}
project_name = Python Selenium Automation Framework
build_name = local-build
session_name = selenium-pytest-session
os = Windows
os_version = 11
browser_name = Chrome
browser_version = latest
local = false
selenium_version = 4.23.0

[timeouts]
implicit_wait = 0
explicit_wait = 15
page_load_timeout = 30
script_timeout = 30
