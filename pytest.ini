[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --junitxml=reports/junit/results.xml
markers =
    smoke: critical tests that validate the most important application flows
    regression: broad validation suite for existing functionality
    e2e: end-to-end business workflow tests
    ui: Selenium browser-based UI tests
    api: REST API automation tests
    database: Database validation tests
    db: Alias for database validation tests
    negative: Negative testing and invalid input scenarios
    cross_browser: Cross-browser compatibility test suite
    login: login workflow tests
    cart: cart workflow tests
    checkout: checkout workflow tests
    product: product catalog and details tests
    search: catalog discovery and search tests
    browserstack: tests intended to run on BrowserStack
    local: tests intended to run on a local browser
    flaky: tests that are temporarily known to be unstable and need investigation
filterwarnings =
    ignore::UserWarning:pytest_html.*
    ignore::DeprecationWarning

